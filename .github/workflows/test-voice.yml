name: Test Voice (1 phrase)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-davinci-KqS8M

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g tsx

      - name: Test 1 phrase arabe
        run: |
          cat > /tmp/test-voice.ts << 'EOF'
          import https from 'https';
          import fs from 'fs';

          const API_KEY  = 'sk_75902bc56e93ce76480a3ff1a33748708d45f0ea1974b5a6';
          const VOICE_ID = 'ZeiYF4oDQt8eyQZ1N7Os';
          const TEXT     = 'مرحباً، أنا كاليكس، مدربتك الشخصية.';

          const body = JSON.stringify({
            text: TEXT,
            model_id: 'eleven_multilingual_v2',
            voice_settings: { stability: 0.5, similarity_boost: 0.75 },
          });

          const req = https.request({
            hostname: 'api.elevenlabs.io',
            path: `/v1/text-to-speech/${VOICE_ID}`,
            method: 'POST',
            headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
          }, (res) => {
            console.log('Status:', res.statusCode);
            if (res.statusCode === 200) {
              const out = fs.createWriteStream('test_ar.mp3');
              res.pipe(out);
              out.on('finish', () => console.log('✅ test_ar.mp3 généré !'));
            } else {
              let err = '';
              res.on('data', d => err += d);
              res.on('end', () => console.log('❌ Erreur:', err));
            }
          });
          req.write(body);
          req.end();
          EOF
          npx tsx /tmp/test-voice.ts

      - name: Commit test MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test_ar.mp3 2>/dev/null || true
          git diff --staged --quiet || git commit -m "test: arabic voice sample" && git push origin claude/quirky-davinci-KqS8M || echo "nothing to commit"
