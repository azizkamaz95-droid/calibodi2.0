name: iOS Build & App Store Upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'scripts/patch-pbxproj.py'
      - 'scripts/patch_firebase_init.py'
      - 'scripts/verify-pbxproj.py'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'capacitor.config.ts'

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      # ─── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Verify Xcode version
        run: xcodebuild -version

      # ─── Node.js ────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # BUILD_TARGET=apk déclenche output:'export' dans next.config.js → génère out/
      - name: Build Next.js (static export)
        run: npm run build
        env:
          BUILD_TARGET: apk

      - name: Verify out/ directory exists
        run: |
          if [ ! -d "out" ] || [ ! -f "out/index.html" ]; then
            echo "ERROR: out/ directory not created by Next.js build"
            exit 1
          fi
          echo "✓ out/ directory OK"

      # ─── Ruby & Fastlane (avant cap sync pour que CocoaPods soit dispo) ────
      - name: Setup Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane + CocoaPods via Bundler
        run: bundle install

      # ─── Capacitor iOS ──────────────────────────────────────────────────────
      - name: Install Capacitor iOS package
        run: npm install @capacitor/ios --legacy-peer-deps

      - name: Add Capacitor iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          else
            echo "iOS platform already exists, skipping"
          fi

      # ─── Clear SPM cache BEFORE cap sync pour éviter "already exists" ──────
      - name: Clear SPM artifact cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/ || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/ || true
          echo "✓ SPM + DerivedData cache cleared"

      # ─── Fix [JSValue] as? [String] always nil — patch plugin Swift source ─
      - name: Fix FirebaseAuthentication providers config cast
        run: |
          SWIFT="node_modules/@capacitor-firebase/authentication/ios/Plugin/FirebaseAuthenticationPlugin.swift"
          echo "=== Before patch ==="
          grep -n "getArray.*providers\|config.providers" "$SWIFT"
          # [JSValue] as? [String] always returns nil in Swift — use compactMap
          sed -i '' 's/if let providers = getConfig().getArray("providers") as? \[String\] {/if let rawProviders = getConfig().getArray("providers") {/' "$SWIFT"
          sed -i '' 's/config\.providers = providers/config.providers = rawProviders.compactMap { \$0 as? String }/' "$SWIFT"
          echo "=== After patch ==="
          grep -n "getArray.*providers\|config.providers\|rawProviders\|compactMap" "$SWIFT"
          echo "✓ providers cast fixed"

      # ─── Patch init() to never return early (root cause fix) ─────────────────
      - name: Patch FirebaseAuthentication init() — remove early return
        run: |
          IMPL="node_modules/@capacitor-firebase/authentication/ios/Plugin/FirebaseAuthentication.swift"
          echo "=== Before init() patch ==="
          grep -n "defaultOptions\|initAuthProviderHandlers\|CAPLog" "$IMPL" | head -10
          python3 scripts/patch_firebase_init.py "$IMPL"
          echo "=== After init() patch ==="
          grep -n "defaultOptions\|initAuthProviderHandlers\|FirebaseApp.configure" "$IMPL" | head -10
          echo "✓ init() early-return removed"

      # ─── Force-init Google provider — bypass providers config check entirely ─
      - name: Force-init GoogleAuthProviderHandler (remove conditional)
        run: |
          IMPL="node_modules/@capacitor-firebase/authentication/ios/Plugin/FirebaseAuthentication.swift"
          echo "=== Before ==="
          grep -n "ProviderId.google\|googleAuthProviderHandler = Google" "$IMPL"
          # Replace the conditional check with an unconditional init
          sed -i '' 's/        if config.providers.contains(ProviderId.google) {/        if true { \/\/ google always enabled/' "$IMPL"
          echo "=== After ==="
          grep -n "ProviderId.google\|googleAuthProviderHandler = Google\|always enabled" "$IMPL"
          echo "✓ Force-init patch applied"

      # ─── Disable Facebook default trait BEFORE cap sync ─────────────────────
      - name: Patch CapacitorFirebaseAuthentication default traits (Google only)
        run: |
          PKG="node_modules/@capacitor-firebase/authentication/Package.swift"
          echo "=== Before ==="
          grep "enabledTraits\|default(" "$PKG"
          # Change default traits from ["Google", "Facebook"] to ["Google"] only
          sed -i '' 's/\.default(enabledTraits: \["Google", "Facebook"\])/.default(enabledTraits: ["Google"])/' "$PKG"
          echo "=== After ==="
          grep "enabledTraits\|default(" "$PKG"
          echo "✓ Facebook trait disabled"

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify capacitor.config.json has providers
        run: |
          CONFIG="ios/App/App/capacitor.config.json"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: capacitor.config.json not found after sync"
            find ios/App -name "*.json" | head -10
            exit 1
          fi
          echo "=== capacitor.config.json ==="
          cat "$CONFIG"
          if ! grep -q "google.com" "$CONFIG"; then
            echo "ERROR: google.com provider missing from capacitor.config.json"
            exit 1
          fi
          echo "✓ providers OK in capacitor.config.json"

      - name: Verify Xcode project structure
        run: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: xcodeproj not found — cap sync may have failed"
            ls -la ios/App/ || echo "ios/App/ missing"
            exit 1
          fi
          echo "✓ Xcode project OK"

      # ─── App Icons iOS ───────────────────────────────────────────────────────
      - name: Generate iOS app icons
        run: |
          SOURCE="resources/icon-ios.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"

          sips -z 20 20     "$SOURCE" --out "$ICONSET/Icon-20.png"
          sips -z 40 40     "$SOURCE" --out "$ICONSET/Icon-20@2x.png"
          sips -z 60 60     "$SOURCE" --out "$ICONSET/Icon-20@3x.png"
          sips -z 29 29     "$SOURCE" --out "$ICONSET/Icon-29.png"
          sips -z 58 58     "$SOURCE" --out "$ICONSET/Icon-29@2x.png"
          sips -z 87 87     "$SOURCE" --out "$ICONSET/Icon-29@3x.png"
          sips -z 40 40     "$SOURCE" --out "$ICONSET/Icon-40.png"
          sips -z 80 80     "$SOURCE" --out "$ICONSET/Icon-40@2x.png"
          sips -z 120 120   "$SOURCE" --out "$ICONSET/Icon-40@3x.png"
          sips -z 120 120   "$SOURCE" --out "$ICONSET/Icon-60@2x.png"
          sips -z 180 180   "$SOURCE" --out "$ICONSET/Icon-60@3x.png"
          sips -z 76 76     "$SOURCE" --out "$ICONSET/Icon-76.png"
          sips -z 152 152   "$SOURCE" --out "$ICONSET/Icon-76@2x.png"
          sips -z 167 167   "$SOURCE" --out "$ICONSET/Icon-83.5@2x.png"
          sips -z 1024 1024 "$SOURCE" --out "$ICONSET/Icon-1024.png"

          cat > "$ICONSET/Contents.json" << 'CONTENTS'
          {
            "images": [
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"Icon-20@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"Icon-20@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"Icon-29@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"Icon-29@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"Icon-40@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"Icon-40@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"Icon-60@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"Icon-60@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"Icon-20.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"Icon-20@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"Icon-29.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"Icon-29@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"Icon-40.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"Icon-40@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"Icon-76.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"Icon-76@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"Icon-83.5@2x.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"Icon-1024.png"}
            ],
            "info":{"author":"xcode","version":1}
          }
          CONTENTS

          echo "✓ iOS icons generated"

      # ─── Set iOS deployment target ───────────────────────────────────────────
      - name: Set iOS deployment target to 16
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g" "$PBXPROJ" || true
          echo "✓ Deployment target patched to 16.0"

      # ─── GoogleService-Info.plist (APRÈS cap sync) ───────────────────────────
      - name: Inject GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST }}
        run: |
          mkdir -p ios/App/App
          echo "$GOOGLE_SERVICES_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          if [ ! -s ios/App/App/GoogleService-Info.plist ]; then
            echo "ERROR: GoogleService-Info.plist empty or missing"
            exit 1
          fi
          echo "✓ GoogleService-Info.plist injected"
          python3 scripts/patch-pbxproj.py
          echo "✓ Xcode project patched"

          # Verify GoogleService-Info.plist is ACTUALLY in PBXResourcesBuildPhase
          # (not just in the PBXBuildFile comment — that was the previous bug)
          python3 scripts/verify-pbxproj.py ios/App/App.xcodeproj/project.pbxproj
          echo "✓ GoogleService-Info.plist confirmed in PBXResourcesBuildPhase"
          echo "✓ capacitor.config.json confirmed in PBXResourcesBuildPhase"

      # ─── Permissions iOS (Info.plist) ────────────────────────────────────────
      - name: Patch Info.plist permissions
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.4.0" "$PLIST"
          echo "✓ Version: 1.4.0"

          BUILD_NUMBER=$(( ${{ github.run_number }} + 200 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          echo "✓ Build number: $BUILD_NUMBER"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CaliBodi utilise la caméra pour scanner tes aliments et suivre ta progression.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CaliBodi utilise la caméra pour scanner tes aliments et suivre ta progression.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'CaliBodi accède à ta galerie pour analyser tes photos de repas et suivre ta progression physique.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'CaliBodi accède à ta galerie pour analyser tes photos de repas et suivre ta progression physique.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'CaliBodi enregistre tes photos de progression dans ta galerie.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'CaliBodi enregistre tes photos de progression dans ta galerie.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CaliBodi utilise le microphone pour le coach vocal Calix pendant tes séances.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'CaliBodi utilise le microphone pour le coach vocal Calix pendant tes séances.'" "$PLIST"

          # REVERSED_CLIENT_ID URL scheme requis pour Google Sign-In iOS
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          echo "REVERSED_CLIENT_ID: $REVERSED_CLIENT_ID"

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string google" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName google" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REVERSED_CLIENT_ID" "$PLIST"
          echo "✓ REVERSED_CLIENT_ID URL scheme ajouté"

          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          echo "✓ Info.plist OK"

      # ─── Certificat P12 ─────────────────────────────────────────────────────
      - name: Import iOS Distribution Certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_NAME="calibodi-build.keychain"
          KEYCHAIN_PASSWORD="calibodi-temp-password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain

          echo "$IOS_P12_BASE64" | base64 --decode > /tmp/certificate.p12
          if [ ! -s /tmp/certificate.p12 ]; then
            echo "ERROR: P12 decode failed or file is empty"
            exit 1
          fi

          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          rm /tmp/certificate.p12
          echo "✓ Certificate imported"

      # ─── Provisioning Profile ───────────────────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          if [ ! -s /tmp/profile.mobileprovision ]; then
            echo "ERROR: Provisioning profile decode failed"
            exit 1
          fi

          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Could not extract UUID from provisioning profile"
            exit 1
          fi

          echo "Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          cp /tmp/profile.mobileprovision "$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"
          rm /tmp/profile.mobileprovision
          echo "✓ Provisioning profile installed"

      # ─── Fastlane Build & Upload ─────────────────────────────────────────────
      - name: Build & Upload to App Store
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: bundle exec fastlane ios build_appstore

      # ─── Upload IPA as GitHub Release ───────────────────────────────────────
      - name: Create GitHub Release and upload IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: "CaliBodi iOS build #${{ github.run_number }}"
          files: build/CaliBodi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
