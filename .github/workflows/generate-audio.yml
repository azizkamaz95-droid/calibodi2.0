name: Generate Calix Audio (ElevenLabs)

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Langue à générer (fr, en, es, ar) — laisser vide pour toutes'
        required: false
        default: ''
      force:
        description: 'Régénérer les fichiers existants (--force)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/quirky-davinci-KqS8M

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Generate audio files
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.lang }}" ]; then
            ARGS="--lang=${{ github.event.inputs.lang }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          npx tsx scripts/generate-calix-audio.ts $ARGS

      - name: Commit generated MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/calix/
          if git diff --staged --quiet; then
            echo "Aucun nouveau fichier à committer"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            LANG="${{ github.event.inputs.lang }}"
            LABEL="${LANG:-all}"
            git commit -m "feat(audio): generate ${COUNT} Calix MP3 files (${LABEL})"
            git push origin claude/quirky-davinci-KqS8M
            echo "✓ ${COUNT} fichiers audio committés et pushés"
          fi
